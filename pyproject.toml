[tool.poetry]
name = "landcover_assignment"
version = "0.4.0"
description = "A goblin tool for the generation of areas of alternative land uses based on spared area available"
authors = ["Colm Duffy"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
# Wide ranges on purpose: goblin_lite pins pandas==2.1.4, and newer stacks use pandas 3 / numpy 2 / SQLAlchemy 2.
# CI tests both ends (oldest and latest). See .goblin-context/dependency-upgrade-plan.md before narrowing.
# catchment_data_api (geo tree) still pins pandas==2.1.4, numpy<2, sqlalchemy<2 itself, so a plain install resolves
# to the oldest set; the "latest" CI job installs it with --no-deps.
python = ">=3.9,<4"
pyomo = ">=6.9.4,<7"
highspy = ">=1.7.2"
pandas = ">=2.1.4,<4"
numpy = ">=1.25,<3"
sqlalchemy = ">=1.4,<3"
catchment_data_api = "^0.1.0"

[tool.poetry.group.dev.dependencies]
# used only by tools/extract_inventory.py to read the EPA CRT / CRF workbooks
openpyxl = "^3.1"

[tool.poetry.group.docs.dependencies]
# Docs toolchain, kept in sync with docs/requirements.txt (used by .readthedocs.yaml).
# astroid <4: astroid 4 made ``manager`` a required argument to AstroidBuilder(), which
# sphinx-autoapi <3.8 calls without it, giving an empty API reference with exit code 0.
astroid = ">=3.0,<4.0"
sphinx-autoapi = ">=3.0"
sphinx = ">=7.0,<9.0"
myst-nb = ">=1.0"
sphinx-rtd-theme = ">=2.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"