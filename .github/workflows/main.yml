name: ci-cd

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported set: what goblin_lite pins today
          - name: oldest
            python-version: "3.10"
            pins: "pandas==2.1.4 numpy==1.26.4 sqlalchemy==1.4.54"
          # newest releases (pandas 3, numpy 2, SQLAlchemy 2)
          - name: latest
            python-version: "3.12"
            pins: ""
    name: tests (${{ matrix.name }})

    steps:
    - name: Check-out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (oldest)
      if: matrix.name == 'oldest'
      run: |
        python -m pip install --upgrade pip
        python -m pip install ${{ matrix.pins }}
        python -m pip install .

    # catchment_data_api 0.1.3 pins pandas==2.1.4, numpy<2 and sqlalchemy<2 itself, so a normal install (of it, or of
    # this package) pulls the oldest set back in. Install the newest dependencies first, then both packages without their
    # dependencies, until catchment_data_api is widened (.goblin-context dependency plan).
    - name: Install dependencies (latest)
      if: matrix.name == 'latest'
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pyomo>=6.9.4,<7" "highspy>=1.7.2" pandas numpy sqlalchemy pyyaml
        python -m pip install --no-deps "catchment_data_api>=0.1.0,<0.2" .

    - name: Show versions
      run: python -m pip list | grep -iE "^(pandas|numpy|sqlalchemy|pyomo|highspy|catchment.data.api) "

    # Warnings are errors, except the pandas deprecation raised inside catchment_data_api (not this package's code).
    - name: Run tests
      run: |
        python -W error -W "ignore:::catchment_data_api.catchment_data_api" -m unittest discover -s tests -p "test_*.py" -v

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Check-out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build the docs (warnings are errors), as Read the Docs does
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r docs/requirements.txt
        sphinx-build -W -b html docs docs/_build/html

  # The check that branch protection requires ("ci"). It passes only if every job passed, so the required check stays
  # the same whatever the matrix holds.
  ci:
    needs: [tests, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: All jobs passed
      run: test "${{ needs.tests.result }}" = "success" && test "${{ needs.docs.result }}" = "success"
